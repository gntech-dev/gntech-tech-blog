name: Telegram webhook watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'functions/api/telegram-approval.js'
      - 'scripts/set-telegram-webhook.mjs'
      - '.github/workflows/telegram-webhook.yml'

concurrency:
  group: telegram-webhook-watchdog
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TELEGRAM_WEBHOOK_URL: https://gntech-tech-blog.pages.dev/api/telegram-approval

jobs:
  ensure-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure Telegram webhook is configured
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
        run: |
          node <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const secret = process.env.TELEGRAM_WEBHOOK_SECRET;
          const webhookUrl = process.env.TELEGRAM_WEBHOOK_URL;

          if (!token || !secret || !webhookUrl) {
            throw new Error('TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, and TELEGRAM_WEBHOOK_URL are required.');
          }

          const response = await fetch(`https://api.telegram.org/bot${token}/setWebhook`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              url: webhookUrl,
              secret_token: secret,
              allowed_updates: ['callback_query'],
              drop_pending_updates: false,
            }),
          });
          const body = await response.json().catch(() => ({}));
          if (!response.ok || !body.ok) {
            console.error(JSON.stringify(body, null, 2));
            throw new Error('Failed to set Telegram webhook.');
          }

          const infoResponse = await fetch(`https://api.telegram.org/bot${token}/getWebhookInfo`);
          const info = await infoResponse.json();
          if (!info.ok || info.result.url !== webhookUrl) {
            console.error(JSON.stringify(info, null, 2));
            throw new Error('Telegram webhook verification failed.');
          }

          console.log(`Telegram webhook configured for ${new URL(webhookUrl).host}.`);
          console.log(`Pending callback updates: ${info.result.pending_update_count ?? 'unknown'}.`);
          NODE
