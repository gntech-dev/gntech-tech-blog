name: Auto-date blog post pubDates

on:
  push:
    branches: [main]
    paths:
      - src/content/blog/*.md

jobs:
  auto-date:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix pubDate for changed posts
        run: |
          set -e
          for file in $(git diff --name-only HEAD~1 HEAD -- src/content/blog/*.md 2>/dev/null || echo ""); do
            [ -z "$file" ] && continue
            commit_date=$(git log -1 --format=%ad --date=format:%Y-%m-%d -- "$file")
            [ -z "$commit_date" ] && continue
            current_date=$(grep "^pubDate:" "$file" | sed "s/pubDate: *//")
            [ "$current_date" = "$commit_date" ] && echo "$file: pubDate already $commit_date" && continue
            sed -i "s/^pubDate:.*$/pubDate: $commit_date/" "$file"
            echo "$file: fixed pubDate $current_date → $commit_date"
          done

      - name: Create PR with date fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          timestamp=$(date +%s)
          branch_name="auto-date-fix-${timestamp}"
          git checkout -b "$branch_name"
          git commit -m "fix: auto-correct blog post pubDates"
          git push origin "$branch_name"
          gh pr create \
            --base main \
            --head "$branch_name" \
            --title "fix: auto-correct blog post pubDates" \
            --body "Auto-generated PR correcting pubDate to match git commit date." \
            --label automated
