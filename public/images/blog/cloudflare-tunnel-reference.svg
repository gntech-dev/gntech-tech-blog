<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Cloudflare Tunnel reference architecture</title>
<desc id="desc">Browser traffic reaches Cloudflare and returns through an outbound cloudflared tunnel to a private homelab service.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0f172a"/><stop offset="1" stop-color="#082f49"/></linearGradient>
  <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#facc15"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/></filter>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="1040" cy="85" r="180" fill="#38bdf8" opacity="0.08"/>
<circle cx="130" cy="560" r="220" fill="#f97316" opacity="0.08"/>
<text x="70" y="86" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="800">Reference architecture</text>
<text x="70" y="126" fill="#93c5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Cloudflare Tunnel for one homelab service</text>
<g font-family="Inter,Segoe UI,Arial,sans-serif" filter="url(#shadow)">
  <rect x="70" y="235" width="210" height="128" rx="24" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="175" y="285" fill="#f8fafc" font-size="24" font-weight="700" text-anchor="middle">User</text>
  <text x="175" y="321" fill="#cbd5e1" font-size="18" text-anchor="middle">Browser HTTPS</text>
  <rect x="495" y="215" width="210" height="168" rx="28" fill="url(#orange)"/>
  <text x="600" y="277" fill="#111827" font-size="28" font-weight="900" text-anchor="middle">Cloudflare</text>
  <text x="600" y="313" fill="#111827" font-size="18" font-weight="700" text-anchor="middle">DNS + edge</text>
  <text x="600" y="342" fill="#111827" font-size="18" font-weight="700" text-anchor="middle">Tunnel routing</text>
  <rect x="918" y="208" width="220" height="182" rx="28" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="1028" y="262" fill="#f8fafc" font-size="25" font-weight="800" text-anchor="middle">Homelab host</text>
  <text x="1028" y="300" fill="#bae6fd" font-size="18" text-anchor="middle">cloudflared</text>
  <text x="1028" y="331" fill="#cbd5e1" font-size="18" text-anchor="middle">private web app</text>
</g>
<g stroke-linecap="round" stroke-width="8" fill="none">
  <path d="M292 299 H475" stroke="#38bdf8"/>
  <path d="M457 281 L481 299 L457 317" stroke="#38bdf8" stroke-linejoin="round"/>
  <path d="M718 299 H896" stroke="#22c55e"/>
  <path d="M878 281 L902 299 L878 317" stroke="#22c55e" stroke-linejoin="round"/>
</g>
<text x="385" y="268" fill="#bae6fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle">public request</text>
<text x="807" y="268" fill="#bbf7d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" text-anchor="middle">outbound tunnel</text>
<rect x="70" y="470" width="1060" height="76" rx="22" fill="#020617" opacity="0.72" stroke="#1e293b"/>
<text x="100" y="516" fill="#e2e8f0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">Outbound-only tunnel. No inbound router port required.</text>
</svg>